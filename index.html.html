<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math-unicorn — Тренажер Таблицы Умножения</title>

    <!-- PWA и иконки -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Math-unicorn">
    <meta name="theme-color" content="#0d0d1a">
    <meta name="description" content="Math-unicorn — веселый тренажер таблицы умножения с милым единорожком. Зарабатывай очки и одевай своего персонажа!">

    <style>
        :root {
            --bg-color: #0d0d1a;
            --panel-bg: #1a1a2e;
            --cyan: #00ffff;
            --purple: #9d00ff;
            --pink: #ff00ff;
            --green: #00ff88;
            --red: #ff3333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            background: radial-gradient(circle at top, #1a1a2e 0%, #0d0d1a 100%);
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            gap: 5px;
        }

        .stat-box { text-align: center; flex: 1; }

        .stat-label {
            font-size: 9px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 17px;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
        }

        .timer { color: var(--pink); }
        .score { color: var(--cyan); }
        .record { color: #ffd700; }

        .restart-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            color: var(--cyan);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            padding: 0;
        }

        .restart-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: rotate(180deg);
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .unicorn-stage {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.4));
            transition: filter 0.5s ease;
            z-index: 10;
        }

        .unicorn-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }

        .layer-hidden { opacity: 0; transform: scale(0.7); }
        .layer-visible { opacity: 1; transform: scale(1); }

        #layer-sweater { margin-top: 10px; }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-anim { animation: popIn 0.5s ease-out; }

        @keyframes dropIn {
            0% { transform: translateY(-150px) scale(0.8); opacity: 0; }
            60% { transform: translateY(10px) scale(1.05); opacity: 1; }
            80% { transform: translateY(-5px) scale(0.98); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .drop-anim { animation: dropIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .game-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .question {
            font-size: 42px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 20px var(--cyan);
            text-align: center;
        }

        .input-container { position: relative; width: 180px; }

        input[type="number"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px;
            font-size: 30px;
            color: white;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .correct-anim {
            border-color: var(--green) !important;
            background: rgba(0, 255, 136, 0.2) !important;
            box-shadow: 0 0 20px var(--green) !important;
        }

        .wrong-anim {
            border-color: var(--red) !important;
            background: rgba(255, 51, 51, 0.2) !important;
            box-shadow: 0 0 20px var(--red) !important;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .hint {
            font-size: 18px;
            color: var(--red);
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            height: 22px;
            text-align: center;
        }

        .hint.show { opacity: 1; }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--cyan), var(--pink));
            transition: width 0.3s ease;
        }

        .btn {
            background: linear-gradient(45deg, var(--cyan), var(--purple));
            border: none;
            border-radius: 30px;
            padding: 14px 50px;
            font-size: 18px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            transition: transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            width: 100%;
        }

        .btn:active { transform: scale(0.95); }

        .difficulty-selector {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: 8px;
        }

        .difficulty-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .difficulty-btn.active {
            background: rgba(0, 255, 255, 0.15);
            border-color: var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .difficulty-btn:active { transform: scale(0.95); }

        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .celebration-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 101;
        }

        .congrats-text {
            position: relative;
            z-index: 102;
            text-align: center;
            padding: 30px 20px;
            background: rgba(13, 13, 26, 0.85);
            border: 2px solid var(--cyan);
            border-radius: 25px;
            box-shadow:
                0 0 30px var(--cyan),
                0 0 60px var(--purple),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            max-width: 85%;
            animation: congratsPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
        }

        @keyframes congratsPop {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .congrats-emoji {
            font-size: 60px;
            margin-bottom: 10px;
            animation: bounceEmoji 1.5s ease-in-out infinite;
        }

        @keyframes bounceEmoji {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.1); }
        }

        .congrats-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, var(--cyan), var(--pink), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: glowText 1.5s ease-in-out infinite alternate;
        }

        @keyframes glowText {
            0% { filter: brightness(1) drop-shadow(0 0 5px var(--cyan)); }
            100% { filter: brightness(1.3) drop-shadow(0 0 20px var(--pink)); }
        }

        .congrats-subtitle {
            font-size: 18px;
            color: white;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .congrats-close-btn {
            background: linear-gradient(45deg, var(--cyan), var(--purple));
            border: none;
            border-radius: 25px;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            transition: transform 0.2s;
            pointer-events: auto;
        }

        .congrats-close-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button class="restart-btn" id="restartBtn" title="Начать заново">🔄</button>
        <div class="stat-box">
            <div class="stat-label">Время</div>
            <div class="stat-value timer" id="timer">00:00</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Очки</div>
            <div class="stat-value score" id="scoreDisplay">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Рекорд</div>
            <div class="stat-value record" id="recordDisplay">0</div>
        </div>
    </div>

    <div class="main-area">
        <div class="unicorn-stage" id="unicornStage">
            <img src="unicorn_base.png" class="unicorn-layer" alt="База" onerror="this.src='https://placehold.co/220x220/1a1a2e/00ffff?text=База'">
            <img src="unicorn_cap.png" class="unicorn-layer layer-hidden" id="layer-cap" alt="Кепка" onerror="this.src='https://placehold.co/220x220/1a1a2e/ff00ff?text=Кепка'">
            <img src="unicorn_sweater.png" class="unicorn-layer layer-hidden" id="layer-sweater" alt="Кофта" onerror="this.src='https://placehold.co/220x220/1a1a2e/9d00ff?text=Кофта'">
            <img src="unicorn_pants.png" class="unicorn-layer layer-hidden" id="layer-pants" alt="Штаны" onerror="this.src='https://placehold.co/220x220/1a1a2e/00ff88?text=Штаны'">
            <img src="unicorn_sneakers.png" class="unicorn-layer layer-hidden" id="layer-sneakers" alt="Кроссовки" onerror="this.src='https://placehold.co/220x220/1a1a2e/ff3333?text=Кроссовки'">
        </div>

        <div class="game-content">
            <div class="question" id="question">2 x 2 = ?</div>
            <div class="input-container">
                <input type="number" id="answerInput" placeholder="?" autocomplete="off">
            </div>
            <div class="hint" id="hint">Правильно: 4</div>
            <button class="btn" id="checkBtn">Проверить</button>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="difficulty-selector">
        <button class="difficulty-btn" data-diff="easy">Легкий (2-5)</button>
        <button class="difficulty-btn active" data-diff="medium">Средний (2-9)</button>
        <button class="difficulty-btn" data-diff="hard">Сложный (6-9)</button>
    </div>
</div>

<div class="celebration-overlay" id="celebrationOverlay">
    <canvas id="fireworksCanvas"></canvas>
    <div class="congrats-text">
        <div class="congrats-emoji">🦄✨</div>
        <div class="congrats-title">Поздравляю!</div>
        <div class="congrats-subtitle">
            Ты умница! Ты молодец!<br>
            Единорожка полностью одет! 🎉
        </div>
        <button class="congrats-close-btn" id="closeCelebration">Продолжить</button>
    </div>
</div>

<script>
    let score = 0;
    let timeSeconds = 0;
    let num1, num2, correctAnswer;
    let isLocked = false;
    let currentUnicornLevel = 0;
    let timerInterval = null;
    let difficulty = 'medium';
    let record = 0;
    let celebrationShown = false;

    try {
        const savedRecord = localStorage.getItem('mathUnicornRecord');
        if (savedRecord) record = parseInt(savedRecord) || 0;
    } catch (e) { console.log('localStorage недоступен'); }

    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplay = document.getElementById('timer');
    const recordDisplay = document.getElementById('recordDisplay');
    const questionDisplay = document.getElementById('question');
    const answerInput = document.getElementById('answerInput');
    const hintDisplay = document.getElementById('hint');
    const checkBtn = document.getElementById('checkBtn');
    const restartBtn = document.getElementById('restartBtn');
    const progressBar = document.getElementById('progressBar');
    const unicornStage = document.getElementById('unicornStage');

    const layerCap = document.getElementById('layer-cap');
    const layerSweater = document.getElementById('layer-sweater');
    const layerPants = document.getElementById('layer-pants');
    const layerSneakers = document.getElementById('layer-sneakers');

    const difficultyBtns = document.querySelectorAll('.difficulty-btn');

    const celebrationOverlay = document.getElementById('celebrationOverlay');
    const closeCelebrationBtn = document.getElementById('closeCelebration');
    const fireworksCanvas = document.getElementById('fireworksCanvas');

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playCorrectSound() {
        setTimeout(() => playTone(523.25, 'sine', 0.1, 0.3), 0);
        setTimeout(() => playTone(659.25, 'sine', 0.1, 0.3), 100);
        setTimeout(() => playTone(783.99, 'sine', 0.4, 0.3), 200);
    }

    function playErrorSound() { playTone(150, 'sawtooth', 0.3, 0.3); }

    function playLevelUpSound() {
        setTimeout(() => playTone(523.25, 'triangle', 0.1, 0.25), 0);
        setTimeout(() => playTone(659.25, 'triangle', 0.1, 0.25), 80);
        setTimeout(() => playTone(783.99, 'triangle', 0.1, 0.25), 160);
        setTimeout(() => playTone(1046.50, 'triangle', 0.3, 0.25), 240);
    }

    function playVictoryMelody() {
        const melody = [
            [523.25, 0.08], [587.33, 0.08], [659.25, 0.08], [698.46, 0.08],
            [783.99, 0.08], [880.00, 0.08], [987.77, 0.08], [1046.50, 0.15],
            [1318.51, 0.12], [1567.98, 0.12], [2093.00, 0.7],
        ];
        let time = 0;
        melody.forEach(([freq, dur]) => {
            setTimeout(() => playTone(freq, 'triangle', dur, 0.3), time * 1000);
            time += dur + 0.03;
        });
        const bass = [
            [261.63, 0.15], [329.63, 0.15], [392.00, 0.15],
            [523.25, 0.15], [659.25, 0.15], [783.99, 0.15], [1046.50, 0.8],
        ];
        let bassTime = 0.9;
        bass.forEach(([freq, dur]) => {
            setTimeout(() => playTone(freq, 'sine', dur, 0.12), bassTime * 1000);
            bassTime += dur;
        });
    }

    function generateQuestion() {
        let min, max;
        if (difficulty === 'easy') { min = 2; max = 5; }
        else if (difficulty === 'hard') { min = 6; max = 9; }
        else { min = 2; max = 9; }

        const range = max - min + 1;
        num1 = Math.floor(Math.random() * range) + min;
        num2 = Math.floor(Math.random() * range) + min;
        correctAnswer = num1 * num2;
        questionDisplay.innerText = `${num1} x ${num2} = ?`;
        answerInput.value = '';
        answerInput.classList.remove('correct-anim', 'wrong-anim');
        hintDisplay.classList.remove('show');
        isLocked = false;
        answerInput.focus();
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeSeconds++;
            const m = String(Math.floor(timeSeconds / 60)).padStart(2, '0');
            const s = String(timeSeconds % 60).padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function animateLayer(layer) {
        layer.classList.remove('drop-anim');
        void layer.offsetWidth;
        layer.classList.add('drop-anim');
    }

    function updateUnicorn() {
        let newLevel = 0;
        if (score >= 400) newLevel = 4;
        else if (score >= 300) newLevel = 3;
        else if (score >= 200) newLevel = 2;
        else if (score >= 100) newLevel = 1;

        const capJustAppeared = (newLevel >= 1 && currentUnicornLevel < 1);
        const sweaterJustAppeared = (newLevel >= 2 && currentUnicornLevel < 2);
        const pantsJustAppeared = (newLevel >= 3 && currentUnicornLevel < 3);
        const sneakersJustAppeared = (newLevel >= 4 && currentUnicornLevel < 4);

        if (newLevel > currentUnicornLevel) {
            unicornStage.classList.remove('pop-anim');
            void unicornStage.offsetWidth;
            unicornStage.classList.add('pop-anim');
            playLevelUpSound();
        }
        currentUnicornLevel = newLevel;

        if (score >= 100) {
            if (capJustAppeared) animateLayer(layerCap);
            layerCap.classList.remove('layer-hidden');
            layerCap.classList.add('layer-visible');
        } else {
            layerCap.classList.add('layer-hidden');
            layerCap.classList.remove('layer-visible');
        }

        if (score >= 200) {
            if (sweaterJustAppeared) animateLayer(layerSweater);
            layerSweater.classList.remove('layer-hidden');
            layerSweater.classList.add('layer-visible');
        } else {
            layerSweater.classList.add('layer-hidden');
            layerSweater.classList.remove('layer-visible');
        }

        if (score >= 300) {
            if (pantsJustAppeared) animateLayer(layerPants);
            layerPants.classList.remove('layer-hidden');
            layerPants.classList.add('layer-visible');
        } else {
            layerPants.classList.add('layer-hidden');
            layerPants.classList.remove('layer-visible');
        }

        if (score >= 400) {
            if (sneakersJustAppeared) animateLayer(layerSneakers);
            layerSneakers.classList.remove('layer-hidden');
            layerSneakers.classList.add('layer-visible');
            unicornStage.style.filter = 'drop-shadow(0 0 25px gold)';

            if (sneakersJustAppeared && !celebrationShown) {
                celebrationShown = true;
                setTimeout(() => showCelebration(), 900);
            }
        } else {
            layerSneakers.classList.add('layer-hidden');
            layerSneakers.classList.remove('layer-visible');
            unicornStage.style.filter = 'drop-shadow(0 0 20px rgba(255, 0, 255, 0.4))';
        }
    }

    function updateProgress() {
        let progress = Math.min((score / 400) * 100, 100);
        progressBar.style.width = `${progress}%`;
    }

    function checkRecord() {
        if (score > record) {
            record = score;
            recordDisplay.innerText = record;
            try { localStorage.setItem('mathUnicornRecord', record.toString()); }
            catch (e) { console.log('Не удалось сохранить рекорд'); }
        }
    }

    function updateScoreUI() {
        scoreDisplay.innerText = score;
        updateUnicorn();
        updateProgress();
        checkRecord();
    }

    function restartGame() {
        score = 0;
        timeSeconds = 0;
        currentUnicornLevel = 0;
        isLocked = false;
        celebrationShown = false;

        scoreDisplay.innerText = '0';
        timerDisplay.innerText = '00:00';
        progressBar.style.width = '0%';

        [layerCap, layerSweater, layerPants, layerSneakers].forEach(layer => {
            layer.classList.add('layer-hidden');
            layer.classList.remove('layer-visible', 'drop-anim');
        });

        unicornStage.style.filter = 'drop-shadow(0 0 20px rgba(255, 0, 255, 0.4))';
        unicornStage.classList.remove('pop-anim');

        stopTimer();
        startTimer();
        generateQuestion();
    }

    function checkAnswer() {
        if (isLocked) return;
        const userAnswer = parseInt(answerInput.value);
        if (isNaN(userAnswer)) return;

        if (userAnswer === correctAnswer) {
            playCorrectSound();
            score += 5;
            updateScoreUI();
            answerInput.classList.add('correct-anim');
            isLocked = true;
            setTimeout(() => generateQuestion(), 800);
        } else {
            playErrorSound();
            score -= 2;
            if (score < 0) score = 0;
            updateScoreUI();
            answerInput.classList.add('wrong-anim');
            hintDisplay.innerText = `Правильно: ${correctAnswer}`;
            hintDisplay.classList.add('show');
            isLocked = true;
            setTimeout(() => {
                answerInput.classList.remove('wrong-anim');
                answerInput.value = '';
                isLocked = false;
                answerInput.focus();
            }, 2000);
        }
    }

    const ctx = fireworksCanvas.getContext('2d');
    let particles = [];
    let animationId = null;
    let fireworksActive = false;

    function resizeCanvas() {
        fireworksCanvas.width = window.innerWidth;
        fireworksCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = Math.random() * 0.015 + 0.008;
            this.size = Math.random() * 3 + 1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.08;
            this.vx *= 0.98;
            this.vy *= 0.98;
            this.life -= this.decay;
            this.size *= 0.98;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function spawnFirework() {
        const colors = ['#00ffff', '#ff00ff', '#9d00ff', '#00ff88', '#ffd700', '#ff3333'];
        const x = Math.random() * fireworksCanvas.width;
        const y = Math.random() * fireworksCanvas.height * 0.6;
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 50; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function animateFireworks() {
        if (!fireworksActive) return;
        ctx.fillStyle = 'rgba(13, 13, 26, 0.15)';
        ctx.fillRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });
        animationId = requestAnimationFrame(animateFireworks);
    }

    function showCelebration() {
        initAudio();
        playVictoryMelody();
        celebrationOverlay.classList.add('active');
        fireworksActive = true;
        particles = [];
        animateFireworks();
        setInterval(() => {
            if (fireworksActive) spawnFirework();
        }, 400);
    }

    function hideCelebration() {
        celebrationOverlay.classList.remove('active');
        fireworksActive = false;
        if (animationId) cancelAnimationFrame(animationId);
        particles = [];
        ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
    }

    checkBtn.addEventListener('click', () => { initAudio(); checkAnswer(); });
    answerInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { initAudio(); checkAnswer(); }
    });
    restartBtn.addEventListener('click', () => { initAudio(); restartGame(); });

    difficultyBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            difficultyBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            difficulty = btn.dataset.diff;
            generateQuestion();
        });
    });

    closeCelebrationBtn.addEventListener('click', hideCelebration);

    restartGame();
</script>
</body>
</html>
